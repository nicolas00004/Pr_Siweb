<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - INFUNI</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .perfil-grid { display: grid; grid-template-columns: 280px 1fr; gap: 40px; margin-top: 40px; align-items: start; }
        @media (max-width: 900px) { .perfil-grid { grid-template-columns: 1fr; } }
        
        .panel-lateral { background: var(--white); border-radius: 20px; box-shadow: var(--shadow-sm); border: 1px solid #e2e8f0; padding: 30px; text-align: center; }
        .avatar-circle { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 20px auto; font-weight: bold; }
        .user-name { font-size: 1.5rem; color: var(--primary-color); margin-bottom: 5px; }
        .user-email { color: var(--text-muted); margin-bottom: 25px; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; transition: all 0.3s; }
        .btn-logout:hover { background: #dc2626; }
        
        .panel-derecho h3 { margin-bottom: 25px; color: var(--primary-color); font-size: 1.8rem; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; display: inline-block; }
        
        .favoritos-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .fav-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid #e2e8f0; transition: transform 0.3s; cursor: pointer; }
        .fav-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--accent-color); }
        .fav-img { height: 150px; background-size: cover; background-position: center; }
        .fav-body { padding: 20px; }
        .fav-title { font-size: 1.3rem; margin-bottom: 10px; color: var(--primary-color); }
        .fav-stats span { display: inline-block; background: var(--bg-light); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; color: var(--text-dark); margin-right: 5px; margin-bottom: 5px; }
        
        .empty-state { text-align: center; padding: 40px; background: var(--bg-light); border-radius: 15px; border: 2px dashed #cbd5e1; }
    </style>
</head>
<body>
    <header>
        <nav class="nav-global">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <h1>INF<span>UNI</span></h1>
                </a>
            </div>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#comparador">Destinos</a></li>
                <li><a href="herramientas.html">Herramientas ▾</a></li>
                <li><a href="comunidad.html">Comunidad ▾</a></li>
                <li>
                    <!-- Este botón cambiará porque estamos en sesión -->
                    <a href="perfil.html" class="btn-login" style="background: var(--primary-color);">Mi Panel 👤</a>
                </li>
            </ul>
        </nav>
    </header>

    <main style="padding: 120px 5% 50px 5%; max-width: 1200px; margin: 0 auto; min-height: 80vh;">
        <div class="perfil-grid">
            
            <aside class="panel-lateral">
                <div class="avatar-circle" id="userAvatar">?</div>
                <h2 class="user-name" id="userNameLabel">Cargando...</h2>
                <p class="user-email" id="userEmailLabel">espere un momento</p>
                <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
            </aside>

            <div class="panel-derecho">
                <h3>Tus Ciudades Favoritas ❤️</h3>
                <div id="favoritosContainer" class="favoritos-list" style="margin-bottom: 50px;">
                    <!-- Cargado por JS -->
                    <div class="empty-state">Cargando tus preferencias...</div>
                </div>

                <h3>Tus Búsquedas Guardadas 💾</h3>
                <div id="busquedasContainer" class="favoritos-list">
                    <!-- Cargado por JS -->
                    <div class="empty-state">Cargando tus búsquedas...</div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const API = 'http://localhost:3000';

        // 1. Verificar si hay sesión
        const userInfoStr = localStorage.getItem('usuarioInfo');
        if (!userInfoStr) {
            window.location.href = 'login.html';
        } else {
            const userInfo = JSON.parse(userInfoStr);
            
            document.getElementById('userNameLabel').innerText = userInfo.nombre;
            document.getElementById('userEmailLabel').innerText = userInfo.email;
            document.getElementById('userAvatar').innerText = userInfo.nombre.charAt(0).toUpperCase();

            fetch(`${API}/api/usuarios/${userInfo.id || userInfo._id}`)
                .then(res => res.json())
                .then(usuarioDB => {
                    const favContainer = document.getElementById('favoritosContainer');
                    const arrayFavoritas = usuarioDB.ciudadesFavoritas || [];

                    if (arrayFavoritas.length === 0) {
                        favContainer.innerHTML = `
                            <div class="empty-state">
                                <span style="font-size: 3rem;">🏜️</span>
                                <p style="margin-top: 15px; color: var(--text-muted); font-size: 1.1rem;">Aún no has guardado ninguna ciudad.</p>
                                <a href="index.html" class="btn-submit" style="display:inline-block; margin-top:20px; text-decoration:none; width: auto;">Explorar Destinos</a>
                            </div>`;
                    } else {
                        favContainer.innerHTML = arrayFavoritas.map(c => `
                            <div class="fav-card">
                                <div class="fav-img" style="background-image: url('${c.imagen || `https://source.unsplash.com/400x300/?${encodeURIComponent(c.nombre)},city`}')" onclick="window.location.href='detalle.html?id=${c._id}'"></div>
                                <div class="fav-body">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <h4 class="fav-title" style="cursor:pointer;" onclick="window.location.href='detalle.html?id=${c._id}'">${c.nombre}</h4>
                                        <button onclick="quitarFavorito('${c._id}')" style="background:none; border:none; cursor:pointer; font-size:1.2rem;" title="Quitar">❌</button>
                                    </div>
                                    <div class="fav-stats" onclick="window.location.href='detalle.html?id=${c._id}'">
                                        <span>💶 ${c.presupuesto || ((c.metricas?.costeAlquilerMedio || 0) + (c.metricas?.costeOcioMedio || 0))}€/mes</span>
                                        <span>🛡️ ${"⭐".repeat(Math.round((c.metricas?.seguridad || 0) / 2))}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('');
                    }

                    // 2. Renderizar Búsquedas
                    const busContainer = document.getElementById('busquedasContainer');
                    const arrayBusquedas = usuarioDB.busquedas || [];

                    if (arrayBusquedas.length === 0) {
                        busContainer.innerHTML = `
                            <div class="empty-state">
                                <span style="font-size: 3rem;">🔍</span>
                                <p style="margin-top: 15px; color: var(--text-muted);">No tienes búsquedas guardadas todavía.</p>
                            </div>`;
                    } else {
                        busContainer.innerHTML = arrayBusquedas.map(b => `
                            <div class="fav-card">
                                <div class="fav-body">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                        <h4 class="fav-title" style="margin:0;">${b.nombre}</h4>
                                        <button onclick="eliminarBusqueda('${b._id}')" style="background:none; border:none; cursor:pointer;" title="Eliminar">🗑️</button>
                                    </div>
                                    <div class="fav-stats">
                                        <span style="background: var(--primary-color); color:white; padding: 2px 8px; border-radius: 10px;">${b.rol === 'estudiante' ? '🎓 Estudiante' : '💼 Trabajador'}</span>
                                        <div style="font-size:0.75rem; margin-top:10px; color:var(--text-muted); line-height:1.4;">
                                            ${Object.entries(b.pesos).map(([k, v]) => `<span style="display:inline-block; margin-right:8px;"><b>${k.charAt(0).toUpperCase()}</b>:${v}</span>`).join('')}
                                        </div>
                                    </div>
                                    <button onclick="localStorage.setItem('tempBusqueda', '${JSON.stringify(b).replace(/'/g, "\\'")}'); window.location.href='index.html'" class="btn-ver" style="margin-top:15px; width:100%; border-radius:10px; font-size:0.85rem;">Cargar Configuración</button>
                                </div>
                            </div>
                        `).join('');
                    }
                })
                .catch(err => {
                    console.error('Error cargando favoritos:', err);
                    document.getElementById('favoritosContainer').innerHTML = '<p>Error de conexión con el servidor.</p>';
                });
        }

        // 2. Función para quitar favorito
        async function quitarFavorito(ciudadId) {
            if(!confirm("¿Quitar esta ciudad de tus favoritos?")) return;
            const userInfo = JSON.parse(localStorage.getItem('usuarioInfo'));
            try {
                const res = await fetch(`${API}/api/usuarios/${userInfo.id || userInfo._id}/favorito`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ciudadId })
                });
                if(res.ok) location.reload(); 
            } catch(e) { alert("Error al eliminar"); }
        }

        async function eliminarBusqueda(busquedaId) {
            if(!confirm("¿Eliminar esta búsqueda guardada?")) return;
            const userInfo = JSON.parse(localStorage.getItem('usuarioInfo'));
            try {
                const res = await fetch(`${API}/api/usuarios/${userInfo.id || userInfo._id}/busquedas/${busquedaId}`, {
                    method: 'DELETE'
                });
                if(res.ok) location.reload();
            } catch(e) { alert("Error al eliminar búsqueda"); }
        }

        // 3. Cerrar sesión
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('usuarioInfo');
            window.location.href = 'index.html';
        });
    </script>
<script src="../js/auth.js"></script>
</body>
</html>
